name: reci_ubate
description: "Aplicación para la gestión de residuos"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - Versiones compatibles
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # Google Sign-In - Versión 7.x
  google_sign_in: ^6.2.1

  # nagevación
  http: ^1.2.0
  flutter_polyline_points: ^2.0.0

  # State Management
  provider: ^6.1.1
  url_launcher: ^6.3.1

  # Mapa - Flutter Map (OpenStreetMap)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Geolocalización
  geolocator: ^14.0.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logotipo.png"



flutter:
  uses-material-design: true
